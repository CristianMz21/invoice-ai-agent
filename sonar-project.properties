sonar.projectKey=invoice-ai-agent
sonar.projectName=Autonomous Invoice AI Agent
sonar.projectVersion=0.1.0

# Source & Test paths
sonar.sources=.
sonar.tests=tests

# Exclusions
sonar.exclusions=tests/**,scripts/**,data/**,docs/**,.venv/**,__pycache__/**,push_to_github.sh
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=app.py,tareas.py

# Python & Coverage configuration
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
