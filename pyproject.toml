[project]
name = "agente-facturas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.51.0",
]

# ── Comandos de automatización (uv run lint | test | dev) ───────────────────
[project.scripts]
lint = "tareas:lint"
test = "tareas:test"
dev = "tareas:dev"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# Empaquetado mínimo: solo el módulo de tareas necesitamos como consola.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tareas.py"]

# ── Ruff: lint + formato profesional ────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (incluye E501 líneas largas)
    "W",   # warnings pycodestyle
    "F",   # pyflakes (variables/imports sin uso)
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna)
    "B",   # flake8-bugbear (bugs comunes)
]
ignore = [
    "UP004",  # Compatible with SonarQube Enterprise Python S1722 (explicit object inheritance)
]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "db_handler",
    "logging_config",
    "main",
    "models",
    "ocr_engine",
    "tareas",
]

# ── Mypy: tipado estricto en el código propio ───────────────────────────────
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# Librerías sin stubs oficiales: importamos con Any (nuestro código sigue estricto).
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "openpyxl.*",
    "rapidocr_onnxruntime.*",
    "pdf2image.*",
]
ignore_missing_imports = true

# ── Pytest + cobertura ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["agent", "models", "db_handler", "ocr_engine", "main"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
