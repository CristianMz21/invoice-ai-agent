[project]
name = "agente-facturas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pdf2image>=1.17.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
